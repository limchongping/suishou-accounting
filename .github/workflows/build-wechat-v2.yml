name: Build WeChat Moments Helper V2
on:
  push:
    branches:
      - build/wechat-moments-helper-v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate project
        shell: bash
        run: |
          mkdir -p /tmp/wechat-src
          echo '' | base64 -d > /tmp/wechat-src/project.zip
          cd /tmp/wechat-src
          unzip -q project.zip
      - name: Build APK
        shell: bash
        run: |
          cd /tmp/wechat-src/WeChatMomentsHelper
          gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WeChatMomentsHelper-V2-debug
          path: /tmp/wechat-src/WeChatMomentsHelper/app/build/outputs/apk/debug/app-debug.apk
