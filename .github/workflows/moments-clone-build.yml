name: Build Moments Clone APK

on:
  workflow_dispatch:
  push:
    branches: [ build-moments-clone-v1 ]
    paths:
      - 'MomentsCloneAssistant/**'
      - '.github/workflows/moments-clone-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MomentsCloneAssistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MomentsCloneAssistant-debug-apk
          path: MomentsCloneAssistant/app/build/outputs/apk/debug/app-debug.apk
