name: Build Local Notes APK
on:
  workflow_dispatch:
  push:
    branches: [ local-notes-v1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Local Notes signing key
        uses: actions/cache@v4
        with:
          path: signing/debug.keystore
          key: local-notes-v25-signing-v1
      - name: Ensure Local Notes signing key
        run: |
          mkdir -p signing
          if [ ! -f signing/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore signing/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Local Notes,O=Offline Apps,C=CN" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LocalNotes-V2.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LocalNotes-V2.5-APK
          path: LocalNotes-V2.5.apk
          if-no-files-found: error
