name: Build AI Moments Copywriter APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ai-moments-copywriter-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AI-Moments-Copywriter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Moments-Copywriter-APK
          path: AI-Moments-Copywriter.apk
          if-no-files-found: error
