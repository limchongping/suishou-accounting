name: Build AI Moments Copywriter APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate bundled HTML JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/html/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found in bundled HTML")
          Path("/tmp/moments-app.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/moments-app.js

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ai-moments-copywriter-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AI-Moments-Copywriter-v2.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Moments-Copywriter-APK-v2.0.0
          path: AI-Moments-Copywriter-v2.0.0.apk
          if-no-files-found: error
