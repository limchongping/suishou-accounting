name: Build Moments Independent V1
on:
  push:
    branches:
      - build/moments-independent-v1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          cd moments-independent
          gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MomentsCloneIndependent-V1
          path: moments-independent/app/build/outputs/apk/debug/app-debug.apk
