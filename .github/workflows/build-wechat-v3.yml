name: Build WeChat Moments Helper V3
on:
  push:
    branches:
      - build/wechat-moments-helper-v3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate project
        shell: bash
        run: |
          rm -rf /tmp/wechat-v3
          mkdir -p /tmp/wechat-v3
          unzip -q wechat-v3/WeChatMomentsHelper_V3_Source.zip -d /tmp/wechat-v3
      - name: Build APK
        shell: bash
        run: |
          cd /tmp/wechat-v3/WeChatMomentsHelper
          gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WeChatMomentsHelper-V3-WeChat8.0.79
          path: /tmp/wechat-v3/WeChatMomentsHelper/app/build/outputs/apk/debug/app-debug.apk
