name: Build Moments Clone APK (PR)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'MomentsCloneAssistant/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MomentsCloneAssistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MomentsCloneAssistant-debug-apk
          path: MomentsCloneAssistant/app/build/outputs/apk/debug/app-debug.apk
