plugins {
    id 'com.android.application'
}

android {
    namespace 'com.suishou.accounting'
    compileSdk 35

    defaultConfig {
        // Separate package ID so installing the copywriter does not replace the user's existing accounting app.
        applicationId 'com.suishou.momentscopywriter'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
