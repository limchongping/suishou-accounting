<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>随手记账</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f5f7f6;color:#17201b;font-family:sans-serif}.app{max-width:680px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;padding-top:4px}h1{font-size:27px;margin:0}.card{background:#fff;border-radius:22px;padding:18px;margin-top:15px}.hero{background:linear-gradient(145deg,#163e2d,#23855c);color:#fff}.bal{font-size:36px;font-weight:800;margin:8px 0 18px}.row{display:flex;gap:10px}.stat{flex:1;background:#ffffff18;padding:12px;border-radius:15px}.muted{color:#85908a;font-size:13px}.hero .muted{color:#d5e8dd}.btn{border:0;border-radius:14px;padding:12px;background:#e8f4ed;color:#17734b;font-weight:700}.add{position:fixed;right:24px;bottom:88px;width:60px;height:60px;border:0;border-radius:50%;background:#1f8a5b;color:#fff;font-size:34px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;height:70px;display:flex;justify-content:space-around;border-top:1px solid #eee}.nav button{border:0;background:none;color:#718079}.page{display:none}.page.on{display:block}.item{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.ico{width:42px;height:42px;border-radius:14px;background:#edf7f1;display:grid;place-items:center;margin-right:11px}.main{flex:1}.amt{font-weight:800}.income{color:#1f8a5b}.sheet{display:none;position:fixed;inset:0;background:#0006;z-index:9;align-items:flex-end}.panel{background:#fff;width:100%;max-width:680px;margin:auto;border-radius:25px 25px 0 0;padding:20px 16px 28px}.seg{display:flex;background:#f1f4f2;border-radius:13px;padding:4px}.seg button{flex:1;border:0;padding:10px;border-radius:10px}.seg .on{background:#fff;color:#17734b}.money{font-size:42px;font-weight:800;width:100%;border:0;outline:0;padding:18px 0}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cat{border:0;border-radius:12px;padding:10px 2px;background:#f4f7f5}.cat.on{background:#dff2e8;color:#17734b}.field{width:100%;padding:12px;border:1px solid #e1e7e4;border-radius:13px;margin-top:10px}.save{width:100%;border:0;border-radius:14px;padding:14px;background:#1f8a5b;color:#fff;font-weight:700;margin-top:12px}.chart{display:flex;align-items:flex-end;height:140px;gap:8px}.col{flex:1;text-align:center;font-size:10px}.col i{display:block;background:#58a984;border-radius:6px 6px 2px 2px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{border:0;border-radius:13px;background:#f2f7f4;padding:12px 2px}.tools button{width:100%;border:0;background:#fff;text-align:left;padding:15px 0;border-bottom:1px solid #eee}.tip{font-size:12px;color:#85908a;line-height:1.6;margin:10px 0 0}</style></head><body><div class="app"><div class="top"><div><div class="muted" id="date"></div><h1>随手记账 <small>V2.1</small></h1></div><button class="btn">日常账本</button></div><section id="home" class="page on"><div class="card hero"><div class="muted">本月结余</div><div class="bal" id="balance">¥0.00</div><div class="row"><div class="stat"><span class="muted">本月支出</span><b id="out">¥0.00</b></div><div class="stat"><span class="muted">本月收入</span><b id="inc">¥0.00</b></div></div></div><div class="card"><b>快捷记账</b><div class="quick" id="quick"></div></div><div class="card"><b>最近账单</b><div id="recent"></div></div></section><section id="detail" class="page"><div class="card"><h2>账单明细</h2><input class="field" id="search" placeholder="搜索分类、备注或日期" oninput="render()"><div id="all"></div></div></section><section id="stats" class="page"><div class="card"><h2>本月统计</h2><div class="chart" id="chart"></div><div id="rank"></div></div></section><section id="mine" class="page"><div class="card"><h2>我的</h2><label>月度预算</label><input class="field" id="budget" type="number" placeholder="输入预算"><button class="save" onclick="setBudget()">保存预算</button></div><div class="card tools"><button onclick="exportCSV()">📄 导出账单文件（CSV）</button><p class="tip">导出全部账单为 CSV 文件，可用 Excel、WPS 等打开。</p><button onclick="backup()">复制完整备份</button><button onclick="restore()">恢复备份</button><button onclick="clearAll()" style="color:#c44">清空账单</button></div></section></div><button class="add" onclick="openSheet()">+</button><nav class="nav"><button onclick="go('home')">首页</button><button onclick="go('detail')">明细</button><button onclick="go('stats')">统计</button><button onclick="go('mine')">我的</button></nav><div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel"><div class="seg"><button id="eBtn" class="on" onclick="type='expense';sync()">支出</button><button id="iBtn" onclick="type='income';sync()">收入</button></div><input class="money" id="money" type="number" placeholder="¥ 0.00"><div class="cats" id="cats"></div><input class="field" id="note" placeholder="备注（可选）"><input class="field" id="when" type="date"><button class="save" onclick="save()">保存这笔</button></div></div><script>const $=x=>document.getElementById(x),key='suishou_v2';let store=JSON.parse(localStorage.getItem(key)||'null')||{bills:[],budget:0,cats:{expense:['餐饮','交通','购物','住房','娱乐','医疗','日用','其他'],income:['工资','奖金','兼职','理财','红包','其他']}};let type='expense',cat='餐饮';const icons={餐饮:'🍜',交通:'🚕',购物:'🛍️',住房:'🏠',娱乐:'🎬',医疗:'💊',日用:'🧻',工资:'💰',奖金:'🎁',兼职:'💼',理财:'📈',红包:'🧧',其他:'◦'};function today(){let d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da}function yuan(n){return '¥'+Number(n||0).toFixed(2)}function persist(){localStorage.setItem(key,JSON.stringify(store))}$('date').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});$('when').value=today();function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');render()}function sync(){$('eBtn').className=type==='expense'?'on':'';$('iBtn').className=type==='income'?'on':'';cat=store.cats[type][0];renderCats()}function renderCats(){$('cats').innerHTML=store.cats[type].map(x=>`<button class="cat ${x===cat?'on':''}" onclick="cat='${x}';renderCats()">${icons[x]||'◦'}<br>${x}</button>`).join('')}function openSheet(pref){type='expense';if(pref)cat=pref;$('sheet').style.display='flex';sync();if(pref){cat=pref;renderCats()}setTimeout(()=>$('money').focus(),100)}function closeSheet(){$('sheet').style.display='none'}function save(){let a=+$('money').value;if(!a)return alert('请输入金额');store.bills.unshift({id:Date.now(),type,cat,amount:a,note:$('note').value.trim(),date:$('when').value||today()});persist();$('money').value='';$('note').value='';closeSheet();render()}function item(b){return `<div class="item" onclick="del(${b.id})"><div class="ico">${icons[b.cat]||'◦'}</div><div class="main"><b>${b.cat}</b><div class="muted">${b.date}${b.note?' · '+b.note:''}</div></div><div class="amt ${b.type}">${b.type==='income'?'+':'-'}${yuan(b.amount)}</div></div>`}function sum(a,t){return a.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0)}function render(){let mk=today().slice(0,7),m=store.bills.filter(x=>x.date.slice(0,7)===mk),iv=sum(m,'income'),ov=sum(m,'expense');$('balance').textContent=yuan(iv-ov);$('out').textContent=yuan(ov);$('inc').textContent=yuan(iv);$('quick').innerHTML=store.cats.expense.slice(0,8).map(x=>`<button onclick="openSheet('${x}')">${icons[x]||'◦'}<br>${x}</button>`).join('');$('recent').innerHTML=store.bills.slice(0,6).map(item).join('')||'<p class="muted">还没有账单，点 + 记一笔</p>';let q=($('search')?.value||'').toLowerCase();$('all').innerHTML=store.bills.filter(x=>(x.cat+x.note+x.date).toLowerCase().includes(q)).map(item).join('')||'<p class="muted">没有账单</p>';$('budget').value=store.budget||'';let buckets=[];for(let i=1;i<=6;i++){let s=(i-1)*5+1,e=i===6?31:i*5,v=m.filter(x=>x.type==='expense'&&+x.date.slice(8,10)>=s&&+x.date.slice(8,10)<=e).reduce((z,x)=>z+x.amount,0);buckets.push([s+'-'+e,v])}let mx=Math.max(1,...buckets.map(x=>x[1]));$('chart').innerHTML=buckets.map(x=>`<div class="col"><i style="height:${Math.max(3,x[1]/mx*110)}px"></i>${x[0]}</div>`).join('');let g={};m.filter(x=>x.type==='expense').forEach(x=>g[x.cat]=(g[x.cat]||0)+x.amount);$('rank').innerHTML=Object.entries(g).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="item"><div class="ico">${icons[x[0]]||'◦'}</div><div class="main"><b>${x[0]}</b></div><b>${yuan(x[1])}</b></div>`).join('')}function del(id){if(confirm('删除这笔账单？')){store.bills=store.bills.filter(x=>x.id!==id);persist();render()}}function setBudget(){store.budget=+$('budget').value||0;persist();alert('预算已保存')}function exportCSV(){let esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';let s='日期,类型,分类,金额,备注\n'+store.bills.map(x=>[x.date,x.type==='expense'?'支出':'收入',x.cat,Number(x.amount).toFixed(2),esc(x.note)].join(',')).join('\n');if(window.Android&&Android.exportCsv){Android.exportCsv('\ufeff'+s)}else if(window.Android){Android.shareCsv('\ufeff'+s)}else{alert('请在安卓应用中使用文件导出功能')}}function backup(){prompt('复制下面的备份文本',JSON.stringify(store))}function restore(){let s=prompt('粘贴备份文本');if(!s)return;try{store=JSON.parse(s);persist();render();alert('恢复完成')}catch(e){alert('备份无效')}}function clearAll(){if(confirm('确定清空全部账单？')){store.bills=[];persist();render()}}render();</script></body></html>
