<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>随手笔记</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">记</div><div class="brand-text"><div class="brand-title">随手笔记</div><div class="brand-sub" id="countText">本地保存 · 0 条</div></div></div>
    <button class="icon-btn" id="menuBtn" aria-label="更多">⋯</button>
  </header>
  <div class="search-wrap"><div class="search"><span>⌕</span><input id="searchInput" placeholder="搜索标题、内容或分类" autocomplete="off" /><button class="x" id="clearSearch">×</button></div></div>
  <div class="filters" id="filters"></div>
  <main class="content"><div class="list" id="noteList"></div><button class="fab" id="addBtn" aria-label="新建笔记">＋</button></main>
</div>

<div class="editor" id="editor">
  <div class="editorbar">
    <button class="back" id="backBtn">‹</button>
    <div class="save-state" id="saveState">已保存到本机</div>
    <div class="editor-actions"><button class="small-btn" id="pinBtn" title="置顶">☆</button></div>
  </div>
  <div class="editor-scroll">
    <input class="title-input" id="titleInput" placeholder="标题" maxlength="120" />
    <input class="category-input" id="categoryInput" placeholder="分类（可选，例如：工作 / 灵感 / 待办）" maxlength="40" />
    <textarea class="body-input" id="bodyInput" placeholder="从这里开始记录…"></textarea>
  </div>
  <div class="editor-footer"><button class="footer-pill" id="wordCount">0 字</button><button class="footer-pill danger" id="deleteBtn">删除笔记</button></div>
</div>

<div class="overlay" id="menuOverlay"><div class="sheet"><div class="handle"></div><div class="sheet-title">数据与安全</div>
  <button class="menu-item" id="exportBtn"><div class="menu-icon">⇩</div><div class="menu-text"><div class="menu-main">导出备份</div><div class="menu-sub">保存为 JSON 文件，便于换机或防止误删</div></div><span>›</span></button>
  <button class="menu-item" id="importBtn"><div class="menu-icon">⇧</div><div class="menu-text"><div class="menu-main">恢复备份</div><div class="menu-sub">从之前导出的 JSON 文件恢复</div></div><span>›</span></button>
  <div class="menu-item"><div class="menu-icon">⌁</div><div class="menu-text"><div class="menu-main">纯本地模式</div><div class="menu-sub">应用未申请 INTERNET 联网权限</div></div><span>✓</span></div>
</div></div>

<div class="dialog-mask" id="dialogMask"><div class="dialog"><h3 id="dialogTitle">确认</h3><p id="dialogText"></p><div class="dialog-actions"><button class="dialog-btn" id="dialogCancel">取消</button><button class="dialog-btn danger" id="dialogOk">确定</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
